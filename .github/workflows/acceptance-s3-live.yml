name: Live S3 Storage Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    if: github.ref == 'refs/heads/lemegeton-v3'
    name: Verify private uploads, guild isolation and cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: lemegeton_s3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lemegeton_s3_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/lemegeton_s3_test
      S3_TEST_ENDPOINT_URL: ${{ secrets.S3_TEST_ENDPOINT_URL }}
      S3_TEST_ACCESS_KEY_ID: ${{ secrets.S3_TEST_ACCESS_KEY_ID }}
      S3_TEST_SECRET_ACCESS_KEY: ${{ secrets.S3_TEST_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out v3 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22"
      - name: Require a dedicated disposable S3-compatible test account
        run: |
          set -Eeuo pipefail
          test -n "$S3_TEST_ENDPOINT_URL"
          test -n "$S3_TEST_ACCESS_KEY_ID"
          test -n "$S3_TEST_SECRET_ACCESS_KEY"
          case "$S3_TEST_ENDPOINT_URL" in https://*) ;; *) exit 1 ;; esac
      - name: Install bot dependencies
        run: npm install --no-audit --no-fund
      - name: Build storage test clients
        run: npm run build
      - name: Verify private upload, signed download, cross-guild denial and deletion recovery
        run: node --test dist/tests/media-storage-s3.integration.test.js
