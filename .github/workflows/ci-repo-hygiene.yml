name: Repository Hygiene CI

on:
  pull_request:
    branches: [multi_guild]
  push:
    branches: [lemegeton-v3]

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Configuration and script validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22"
      - name: Parse repository JSON configuration
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done < <(find . -type f -name '*.json' \
            -not -path './.git/*' \
            -not -path '*/node_modules/*' \
            -not -path '*/dist/*' \
            -not -path '*/target/*' -print0)
      - name: Validate Node environment template
        run: node --env-file=.env.example -e "process.exit(0)"
      - name: Parse JavaScript maintenance and acceptance scripts
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find scripts -type f -name '*.mjs' -print0)
      - name: Validate shell syntax
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' \
            -not -path './.git/*' \
            -not -path '*/node_modules/*' \
            -not -path '*/target/*' -print0)
      - name: Check whitespace errors in current commit
        run: git diff --check HEAD^ HEAD
