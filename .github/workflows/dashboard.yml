name: Dashboard security and backend checks

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
  pull_request:
    branches: [multi_guild]
    paths:
      - "Cargo.toml"
      - "src/**"
      - "helpers/**"
      - "tests/**"
      - "tsconfig.json"
      - "web/**"
      - "bot.ts"
      - "database.ts"
      - "package.json"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/start.sh"
      - "railway.json"
      - "railway.toml"
      - "Procfile"
      - ".github/workflows/dashboard.yml"
  push:
    branches: [multi_guild, lemegeton-v3]
    paths:
      - ".github/workflows/dashboard.yml"
      - "Cargo.toml"
      - "src/**"
      - "helpers/**"
      - "tests/**"
      - "tsconfig.json"
      - "web/**"
      - "bot.ts"
      - "database.ts"
      - "package.json"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/start.sh"
      - "railway.json"
      - "railway.toml"
      - "Procfile"

jobs:
  dashboard:
    name: Frontend and Rust backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Node.js environment template
        run: node --env-file=.env.example -e "process.exit(0)"
      - run: npm install --prefix web/frontend --no-audit --no-fund
      - run: npm run typecheck --prefix web/frontend
      - run: npm audit --prefix web/frontend --audit-level=high
      - run: npm run build --prefix web/frontend
      - run: test -s web/frontend/out/index.html && test -s web/frontend/out/login/index.html
      - run: find web/frontend/out/_next/static -type f -name '*.js' -print -quit | grep -q .
      - run: find web/frontend/out/_next/static -type f -name '*.css' -print -quit | grep -q .
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path web/backend/Cargo.toml
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  container:
    name: Docker build and runtime contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate startup script
        run: bash -n scripts/start.sh
      - name: Validate Compose configuration
        run: |
          touch .env
          docker compose config --quiet
      - name: Build production image
        run: docker build --pull --progress=plain --tag lemegeton:ci .
      - name: Verify non-root user and health check
        run: |
          test "$(docker image inspect lemegeton:ci --format '{{.Config.User}}')" = "10001:10001"
          docker image inspect lemegeton:ci --format '{{.Config.Healthcheck.Test}}' | grep -Fq 'http://127.0.0.1:8080/login'
