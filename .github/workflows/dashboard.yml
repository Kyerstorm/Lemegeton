name: Dashboard security and backend checks

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
  pull_request:
    paths:
      - "Cargo.toml"
      - "dashboard-rs/**"
      - "dashboard-frontend/**"
      - "dashboard-rs/src/ui.rs"
      - "tests/test_dashboard_bridge.py"
      - "tests/test_dashboard_assets.py"
      - "tests/test_dashboard_command_policy.py"
      - "helpers/media_storage.py"
      - "helpers/media_graph.py"
      - "helpers/custom_roles/service.py"
      - "helpers/custom_roles/storage.py"
      - "cogs/media/panel.py"
      - "cogs/media/community_archives.py"
      - "cogs/media/three_by_three.py"
      - "cogs/social/anilist_site_embed.py"
      - "cogs/utilities/help.py"
      - "cogs/media/browse.py"
      - "helpers/tmdb_discovery.py"
      - "tests/test_novelupdates_scraper.py"
      - "tests/test_screen_discovery.py"
      - "cogs_test/general_commands/connected_media.py"
      - "cogs_test/general_commands/cross_media_recommendations.py"
      - "cogs_test/general_commands/discovery_hub.py"
      - "cogs_test/general_commands/franchise.py"
      - "cogs_test/general_commands/game.py"
      - "tests/test_media_storage.py"
      - "tests/test_media_graph.py"
      - "requirements.txt"
      - "tests/custom_roles/test_picker_web.py"
      - "tests/custom_roles/test_picker_disabled.py"
      - "tests/custom_roles/test_picker_edit.py"
      - "tests/custom_roles/test_picker_icon.py"
      - "bot.py"
      - "config.py"
      - "cogs_test/general_commands/dashboard.py"
      - "tests/test_custom_role_picker_server.py"
      - "README.md"
      - "docs/DASHBOARD.md"
      - "docs/SECURITY_AUDIT.md"
      - "web/**"
      - "deploy/vps/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".env.example"
      - "database.py"
      - "cogs/utilities/say.py"
      - "tests/test_privacy_hardening.py"
      - "railway.json"
      - "railway.toml"
      - "Procfile"
      - ".github/workflows/dashboard.yml"
      - "railpack.json"
      - "config/railway.json"
      - "scripts/start.sh"
  push:
    branches: [multi_guild]
    paths:
      - "Cargo.toml"
      - "dashboard-rs/**"
      - "dashboard-frontend/**"
      - "tests/test_dashboard_bridge.py"
      - "tests/test_dashboard_assets.py"
      - "tests/test_dashboard_command_policy.py"
      - "helpers/media_storage.py"
      - "helpers/media_graph.py"
      - "helpers/custom_roles/service.py"
      - "helpers/custom_roles/storage.py"
      - "cogs/media/panel.py"
      - "cogs/media/community_archives.py"
      - "cogs/media/three_by_three.py"
      - "cogs/social/anilist_site_embed.py"
      - "cogs/utilities/help.py"
      - "cogs/media/browse.py"
      - "helpers/tmdb_discovery.py"
      - "tests/test_novelupdates_scraper.py"
      - "tests/test_screen_discovery.py"
      - "cogs_test/general_commands/connected_media.py"
      - "cogs_test/general_commands/cross_media_recommendations.py"
      - "cogs_test/general_commands/discovery_hub.py"
      - "cogs_test/general_commands/franchise.py"
      - "cogs_test/general_commands/game.py"
      - "tests/test_media_storage.py"
      - "tests/test_media_graph.py"
      - "requirements.txt"
      - "bot.py"
      - "config.py"
      - "cogs_test/general_commands/dashboard.py"
      - "tests/test_custom_role_picker_server.py"
      - "docker-compose.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "deploy/vps/**"
      - "web/**"
      - "docs/SECURITY_AUDIT.md"
      - "docs/DASHBOARD.md"
      - "railpack.json"
      - "config/railway.json"
      - "scripts/start.sh"
      - "railway.json"
      - "railway.toml"
      - ".env.example"
      - "database.py"
      - "cogs/utilities/say.py"
      - "tests/test_privacy_hardening.py"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix dashboard-frontend --no-audit --no-fund
      - run: npm run typecheck --prefix dashboard-frontend
      - run: npm audit --prefix dashboard-frontend --audit-level=high
      - run: npm run build --prefix dashboard-frontend
      - run: test -s dashboard-frontend/dist/app.js && test -s dashboard-frontend/dist/app.css
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install aiohttp python-dotenv discord.py==2.7.1 asyncpg==0.32.0 "boto3>=1.35,<2" beautifulsoup4 botasaurus "scrapling[fetchers]>=0.4.15,<1.0" "Scrapy>=2.13,<3.0"
      - run: python -m compileall -q database.py cogs/utilities/say.py tests/test_privacy_hardening.py bot.py web config.py cogs/media/browse.py tests/test_novelupdates_scraper.py helpers/web_scraper.py helpers/tmdb_discovery.py tests/test_screen_discovery.py cogs/utilities/help.py cogs_test/general_commands/dashboard.py cogs_test/general_commands/connected_media.py cogs_test/general_commands/cross_media_recommendations.py cogs_test/general_commands/discovery_hub.py cogs_test/general_commands/franchise.py cogs_test/general_commands/game.py cogs/media/panel.py cogs/media/community_archives.py cogs/media/three_by_three.py cogs/social/anilist_site_embed.py helpers/media_storage.py helpers/media_graph.py helpers/custom_roles/service.py helpers/custom_roles/storage.py tests/test_media_storage.py tests/test_media_graph.py
      - run: python -m unittest discover -s tests -p "test_media_storage.py"
      - run: python -m unittest discover -s tests -p "test_privacy_hardening.py"
      - run: python -m unittest discover -s tests -p "test_media_graph.py"
      - run: python -m unittest discover -s tests -p "test_dashboard_bridge.py"
      - run: python -m unittest discover -s tests -p "test_custom_role_picker_server.py"
      - run: python -m unittest discover -s tests -p "test_rate_limit_memory.py"
      - run: python -m unittest discover -s tests -p "test_dashboard_assets.py"
      - run: python -m unittest discover -s tests -p "test_dashboard_command_policy.py"
      - run: python -m unittest discover -s tests -p "test_screen_discovery.py"
      - run: python -m unittest discover -s tests -p "test_novelupdates_scraper.py"
