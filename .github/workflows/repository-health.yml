name: Repository health

on:
  push:
    branches: [multi_guild]
    paths-ignore:
      - TECH_STACK.md
  pull_request:
    branches: [multi_guild]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Source and manifest quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff
      - name: Run repository quality checks
        run: python .github/scripts/repository_health.py --quality

  stack:
    name: Refresh detected tech stack
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Generate TECH_STACK.md
        env:
          GITHUB_TOKEN: ${{ github.token }}}
          GITHUB_REPOSITORY: Kyerstorm/Lemegeton
        run: python .github/scripts/repository_health.py --stack
      - name: Commit report when the detected stack changes
        run: |
          if git diff --quiet -- TECH_STACK.md; then
            echo "Tech stack is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TECH_STACK.md
          git commit -m "chore: refresh detected tech stack [skip ci]"
          git push
