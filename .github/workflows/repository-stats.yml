name: Repository statistics

on:
  push:
    branches: [multi_guild]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh generated README metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh README statistics
        run: node scripts/repo-stats.mjs --update-readme
      - name: Commit updated statistics
        run: |
          if git diff --quiet -- README.md; then
            echo "README statistics already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh repository statistics"
          git push origin HEAD:multi_guild
