name: GitHub Actions Security Lint

on:
  pull_request:
    branches: [multi_guild]
  push:
    branches: [lemegeton-v3]

permissions:
  contents: read
  actions: read

concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Validate workflow syntax and expressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint every GitHub Actions workflow
        run: '"$(go env GOPATH)/bin/actionlint" -color'

  zizmor:
    name: Audit workflow supply-chain and permissions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete workflow history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Analyze workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd
        with:
          inputs: .github/workflows
          collect: workflows
          version: v1.0.0
          persona: auditor
          min-severity: low
          online-audits: true
          advanced-security: false
          annotations: true
