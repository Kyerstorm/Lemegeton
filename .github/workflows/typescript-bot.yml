name: TypeScript bot

on:
  pull_request:
    branches: [multi_guild]
    paths:
      - "Src/**"
      - "Helpers/**"
      - "tests/**"
      - "bot.ts"
      - "database.ts"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/typescript-bot.yml"
  push:
    branches: [multi_guild]
    paths:
      - "Src/**"
      - "Helpers/**"
      - "tests/**"
      - "bot.ts"
      - "database.ts"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/typescript-bot.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Type-check and test TypeScript bot
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build and run tests
        run: npm test
