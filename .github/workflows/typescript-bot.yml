name: TypeScript bot

on:
  pull_request:
    branches: [multi_guild]
    paths:
      - "src/**"
      - "helpers/**"
      - "tests/**"
      - "bot.ts"
      - "database.ts"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/typescript-bot.yml"
  push:
    branches: [multi_guild, lemegeton-v3]
    paths:
      - "src/**"
      - "helpers/**"
      - "tests/**"
      - "bot.ts"
      - "database.ts"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/typescript-bot.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Type-check and test TypeScript bot
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lemegeton-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: lemegeton_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lemegeton_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
        env:
          MINIO_ROOT_USER: lemegeton-ci
          MINIO_ROOT_PASSWORD: lemegeton-minio-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 9000:9000
        command: server /data
    env:
      TEST_DATABASE_URL: postgresql://postgres:lemegeton-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/lemegeton_test
      S3_TEST_ENDPOINT_URL: http://127.0.0.1:9000
      S3_TEST_ACCESS_KEY_ID: lemegeton-ci
      S3_TEST_SECRET_ACCESS_KEY: lemegeton-minio-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build and run tests
        run: npm test
