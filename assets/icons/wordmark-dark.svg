<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="wordmark-title wordmark-desc">
  <title id="wordmark-title">Lemegeton</title>
  <desc id="wordmark-desc">A stacked two-line Lemegeton wordmark with a hand-traced outline.</desc>
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#f5f5f5" stroke="#969696" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round">
    <text x="360" y="122" font-size="96" letter-spacing="22" stroke-dasharray="5000" stroke-dashoffset="5000">LEME
      <animate attributeName="stroke-dashoffset" from="5000" to="0" dur="2.4s" begin="0s" fill="freeze"/>
    </text>
    <text x="360" y="226" font-size="112" letter-spacing="14" stroke-dasharray="5000" stroke-dashoffset="5000">GETON
      <animate attributeName="stroke-dashoffset" from="5000" to="0" dur="2.6s" begin="0.28s" fill="freeze"/>
    </text>
  </g>
  <path d="M218 258 H502" fill="none" stroke="#f5f5f5" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="284" stroke-dashoffset="284">
    <animate attributeName="stroke-dashoffset" from="284" to="0" dur="1.1s" begin="2.35s" fill="freeze"/>
  </path>
</svg>
