<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1440" viewBox="0 0 2400 1440" role="img" aria-labelledby="title desc">
<title id="title">Music / Provider &amp; Release Flow</title><desc id="desc">MusicDiscovery uses MusicBrainz, Last.fm and setlist.fm for identity, discography, charts and setlists. A separate per-guild release tracker connects Spotify, YouTube Data API and SoundCloud. SoundCloud uses its API for identity resolution and its RSS feed for release updates. Planned phases are distinguished from implemented behavior.</desc><defs><style>
.bg{fill:#050505}.panel{fill:#0b0b0b;stroke:#626262;stroke-width:1.5}.inner{fill:#111;stroke:#3e3e3e;stroke-width:1}
.rule{stroke:#3b3b3b;stroke-width:1}.line{fill:none;stroke:#e6e6e6;stroke-width:2;marker-end:url(#arrow)}
.eyebrow{fill:#a1a1a1;font:600 15px Arial,sans-serif;letter-spacing:3px}.title{fill:#fff;font:700 43px Arial,sans-serif;letter-spacing:4px}
.heading{fill:#f4f4f4;font:700 23px Arial,sans-serif}.sub{fill:#eee;font:700 16px Arial,sans-serif;letter-spacing:1px}
.body{fill:#c4c4c4;font:15px Arial,sans-serif}.small{fill:#929292;font:13px Arial,sans-serif}
.mono{fill:#fff;font:700 14px 'SFMono-Regular',Consolas,monospace}.name{fill:#ededed;font:14px Arial,sans-serif}
.pill{fill:#151515;stroke:#686868;stroke-width:1}.pillmuted{fill:#101010;stroke:#454545;stroke-width:1}
.pilltext{fill:#ddd;font:600 10px Arial,sans-serif;letter-spacing:.25px}.count{fill:#fff;font:700 15px 'SFMono-Regular',Consolas,monospace}
</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#e6e6e6"/></marker></defs>
<rect class="bg" width="2400" height="1440"/><text x="64" y="62" class="eyebrow" text-anchor="start">LEMEGETON / MEDIA SYSTEM</text><text x="64" y="119" class="title" text-anchor="start">MUSIC / PROVIDER &amp; RELEASE FLOW</text><path class="rule" d="M64 154H2336"/>

<text x="64" y="210" class="eyebrow" text-anchor="start">01 / DISCOVERY AND METADATA</text>
<rect class="panel" x="64" y="238" width="700" height="252" rx="12"/><text x="96" y="282" class="heading" text-anchor="start">MusicBrainz</text><text x="96" y="326" class="mono" text-anchor="start">Artist identity · labels · release groups</text><text x="96" y="370" class="body" text-anchor="start">Implemented · public REST API</text><text x="96" y="404" class="body" text-anchor="start">Global request queue: one request / second</text><text x="96" y="438" class="body" text-anchor="start">Cached provider metadata and source links</text>
<rect class="panel" x="794" y="238" width="700" height="252" rx="12"/><text x="826" y="282" class="heading" text-anchor="start">Last.fm</text><text x="826" y="326" class="mono" text-anchor="start">Global artist / track charts and tags</text><text x="826" y="370" class="body" text-anchor="start">Implemented · API key required</text><text x="826" y="404" class="body" text-anchor="start">Chart scope stays provider-labelled</text><text x="826" y="438" class="body" text-anchor="start">Never presented as guild listening activity</text>
<rect class="panel" x="1524" y="238" width="812" height="252" rx="12"/><text x="1556" y="282" class="heading" text-anchor="start">setlist.fm</text><text x="1556" y="326" class="mono" text-anchor="start">Artist setlists · venues · tours · song order</text><text x="1556" y="370" class="body" text-anchor="start">Implemented · API key required</text><text x="1556" y="404" class="body" text-anchor="start">Preserve original setlist links and attribution</text><text x="1556" y="438" class="body" text-anchor="start">Coverage is not represented as exhaustive</text>
<path class="rule" d="M64 540H2336"/>
<text x="64" y="590" class="eyebrow" text-anchor="start">02 / PER-GUILD RELEASE TRACKERS</text>
<rect class="panel" x="64" y="620" width="690" height="342" rx="12"/><text x="96" y="664" class="heading" text-anchor="start">Spotify Web API</text><text x="96" y="706" class="mono" text-anchor="start">Artist resolution + latest album / single</text><text x="96" y="752" class="body" text-anchor="start">Client credentials and current app eligibility</text><text x="96" y="788" class="body" text-anchor="start">Release IDs deduplicated per tracker</text><text x="96" y="824" class="body" text-anchor="start">Provider release dates and links retained</text>
<path class="line" d="M754 790L794 790" marker-end="url(#arrow)"/>
<rect class="panel" x="794" y="620" width="690" height="342" rx="12"/><text x="826" y="664" class="heading" text-anchor="start">YouTube Data API</text><text x="826" y="706" class="mono" text-anchor="start">Channel → uploads playlist → latest uploads</text><text x="826" y="752" class="body" text-anchor="start">API key and quota required</text><text x="826" y="788" class="body" text-anchor="start">Upload playlist ID cached after resolution</text><text x="826" y="824" class="body" text-anchor="start">No audio/video download or stream ripping</text>
<path class="line" d="M1484 790L1524 790" marker-end="url(#arrow)"/>
<rect class="panel" x="1524" y="620" width="812" height="342" rx="12"/><text x="1556" y="664" class="heading" text-anchor="start">SoundCloud API + RSS</text><text x="1556" y="706" class="mono" text-anchor="start">API resolves user · RSS supplies new releases</text><text x="1556" y="752" class="body" text-anchor="start">Client credentials for user/catalogue matching</text><text x="1556" y="788" class="body" text-anchor="start">sounds.rss feed parsed: up to five items</text><text x="1556" y="824" class="body" text-anchor="start">HTTPS SoundCloud links only; no media download</text>
<path class="rule" d="M64 1012H2336"/>
<text x="64" y="1062" class="eyebrow" text-anchor="start">03 / IMPLEMENTATION BOUNDARY</text>
<rect class="inner" x="64" y="1092" width="1092" height="244" rx="12"/><text x="96" y="1136" class="sub" text-anchor="start">Implemented / partially implemented</text><text x="96" y="1180" class="body" text-anchor="start">MusicBrainz discovery, Last.fm charts and setlist.fm Live are implemented.</text><text x="96" y="1218" class="body" text-anchor="start">Guild-scoped release trackers have baseline polling, deduplication, pause/resume/test/remove.</text><text x="96" y="1256" class="body" text-anchor="start">Tracker management remains permission-gated; provider outages are isolated.</text>
<rect class="inner" x="1180" y="1092" width="1156" height="244" rx="12"/><text x="1212" y="1136" class="sub" text-anchor="start">Planned work stays labelled planned</text><text x="1212" y="1180" class="body" text-anchor="start">Release Radar is a planned discovery panel, not a new polling system.</text><text x="1212" y="1218" class="body" text-anchor="start">Release-type filters and notification modes remain outstanding tracker work.</text><text x="1212" y="1256" class="body" text-anchor="start">Community release discussions reuse Community sessions; no separate music social feed.</text>
<text x="2336" y="1390" class="small" text-anchor="end">LEMEGETON / MUSIC PROVIDER FLOW — V3</text>

</svg>