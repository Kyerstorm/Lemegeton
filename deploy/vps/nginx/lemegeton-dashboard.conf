# Install into /etc/nginx/conf.d/ after obtaining the TLS certificate.
# Replace dashboard.example.com with your actual dashboard hostname.
# Nginx loads conf.d files within the http context; limit_req_zone must be in that context.
limit_req_zone $binary_remote_addr zone=dashboard_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=dashboard_api:20m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=dashboard_conn:10m;

server {
    listen 80;
    server_name dashboard.example.com;
    server_tokens off;
    return 301 https://dashboard.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dashboard.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LEMEGETON_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_early_data off;

    client_max_body_size 2m;
    client_header_timeout 15s;
    client_body_timeout 20s;
    send_timeout 30s;
    keepalive_timeout 15s;
    limit_conn dashboard_conn 40;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Permitted-Cross-Domain-Policies none always;

    location = /oauth/start {
        limit_req zone=dashboard_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/lemegeton-proxy-params.conf;
    }

    location = /oauth/callback {
        limit_req zone=dashboard_login burst=8 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/lemegeton-proxy-params.conf;
    }

    location = /custom-roles {
        client_max_body_size 13m;
        limit_req zone=dashboard_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/lemegeton-proxy-params.conf;
    }

    location ^~ /custom-roles/ {
        client_max_body_size 13m;
        limit_req zone=dashboard_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/lemegeton-proxy-params.conf;
    }

    location / {
        limit_req zone=dashboard_api burst=80 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/lemegeton-proxy-params.conf;
    }
}
