services:
  lemegeton:
    build:
      context: .
      dockerfile: Dockerfile
    image: lemegeton:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_ALLOW_PUBLIC_BIND: "true"
      DASHBOARD_PORT: "8080"
      LIBSQL_PATH: "/app/data/bot/lemegeton.db"
      ROCKSDB_PATH: "/app/data/objects"
      BACKUP_DIRECTORY: "/app/data/backups"
      DASHBOARD_SESSION_DB_PATH: "/app/data/dashboard/sessions.sqlite"
      HOME: "/app/runtime-home"
      XDG_CACHE_HOME: "/app/runtime-home/.cache"
      TMPDIR: "/tmp"
      BOTASAURUS_MODE: "remote"
      BOTASAURUS_WORKER_URL: "http://botasaurus-worker:8765"
      BOTASAURUS_WORKER_TOKEN: ${BOTASAURUS_WORKER_TOKEN:?Set BOTASAURUS_WORKER_TOKEN in .env}
    depends_on:
      botasaurus-worker:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./runtime-home:/app/runtime-home
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  botasaurus-worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    image: lemegeton-botasaurus:local
    restart: unless-stopped
    init: true
    environment:
      BOTASAURUS_HOST: "0.0.0.0"
      BOTASAURUS_PORT: "8765"
      BOTASAURUS_WORKER_TOKEN: ${BOTASAURUS_WORKER_TOKEN:?Set BOTASAURUS_WORKER_TOKEN in .env}
      BOTASAURUS_CACHE_DIR: "/app/data/cache"
      BOTASAURUS_OBSCURA_BINARY: "/usr/local/bin/obscura"
      BOTASAURUS_CHROMIUM_FALLBACK: "true"
      HOME: "/app/data/home"
    expose:
      - "8765"
    volumes:
      - botasaurus-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  botasaurus-data:
