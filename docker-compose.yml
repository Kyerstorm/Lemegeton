services:
  lemegeton:
    build:
      context: .
      dockerfile: Dockerfile
    image: lemegeton:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_ALLOW_PUBLIC_BIND: "true"
      DASHBOARD_PORT: "8080"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/app"
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: "/app/runtime-home"
      XDG_CACHE_HOME: "/app/runtime-home/.cache"
      TMPDIR: "/tmp"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./runtime-home:/app/runtime-home
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/login', timeout=3).read(1)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
