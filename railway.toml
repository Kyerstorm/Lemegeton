[build]
builder = "RAILPACK"
buildCommand = "python -m pip install -r requirements.txt && cargo build --manifest-path dashboard-rs/Cargo.toml --release"

[deploy]
startCommand = "./scripts/start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[deploy.volumes]]
mountPath = "/app/data"
name = "lemegeton-data"
