[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "./scripts/start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[deploy.volumes]]
mountPath = "/app/data"
name = "lemegeton-data"

[variables]
DASHBOARD_HOST = "0.0.0.0"
DASHBOARD_ALLOW_PUBLIC_BIND = "true"
