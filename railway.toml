[build]
builder = "RAILPACK"
buildCommand = "python -m pip install -r requirements.txt && npm install --prefix dashboard-frontend --no-audit --no-fund && npm run typecheck --prefix dashboard-frontend && npm run build --prefix dashboard-frontend && cargo build --manifest-path dashboard-rs/Cargo.toml --release"

[deploy]
startCommand = "./scripts/start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[deploy.volumes]]
mountPath = "/app/data"
name = "lemegeton-data"

[variables]
DASHBOARD_HOST = "0.0.0.0"
DASHBOARD_ALLOW_PUBLIC_BIND = "true"
PYTHONUNBUFFERED = "1"
PYTHONPATH = "/app"
