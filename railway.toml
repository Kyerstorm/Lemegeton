[build]
builder = "RAILPACK"
buildCommand = "npm install --no-audit --no-fund && npm test && npm install --prefix web/frontend --no-audit --no-fund && npm run typecheck --prefix web/frontend && npm run build --prefix web/frontend && cargo build --manifest-path web/backend/Cargo.toml --release"

[deploy]
startCommand = "./scripts/start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[deploy.volumes]]
mountPath = "/app/data"
name = "lemegeton-data"

[variables]
DASHBOARD_HOST = "0.0.0.0"
DASHBOARD_ALLOW_PUBLIC_BIND = "true"
