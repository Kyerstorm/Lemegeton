[package]
name = "lemegeton-storage-node"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
lemegeton-storage = { path = "../storage" }
libsql = { version = "0.10", default-features = false, features = ["core"] }
napi = { version = "3", features = ["napi8", "async"] }
napi-derive = "3"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
