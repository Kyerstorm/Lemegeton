[package]
name = "lemegeton-storage"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
libsql = { version = "0.10", default-features = false, features = ["core"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
uuid = { version = "1", features = ["v4"] }

[lib]
path = "lib.rs"
