  <image href="/brand/lemegeton.svg" x="6" y="6" width="100" height="100" preserveAspectRatio="xMidYMid meet" filter="invert(1)"/>
  <g fill="#F4F4F4">
    <text x="126" y="59" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="5">LEMEGETON</text>
    <text x="129" y="84" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="600" letter-spacing="3.2">DISCORD / CONTROL PLANE</text>
  </g>
</svg>
